<!-- Substitua o conteúdo do modal de cotação por este: -->
<!-- Modal: Nova Cotação -->
<div id="modalCotacao" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2><i class="fas fa-plus-circle"></i> Nova Cotação</h2>
      <button class="close-modal" onclick="document.getElementById('modalCotacao').style.display='none'">&times;</button>
    </div>
    <div class="modal-body">
      <form id="formCotacao">
        <div class="form-grid">
          <!-- Coluna 1 -->
          <div class="form-group">
            <label>Produto *</label>
            <select id="cotacaoProduto" required>
              <option value="">Selecione o produto...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fornecedor *</label>
            <select id="cotacaoFornecedor" required>
              <option value="">Selecione o fornecedor...</option>
            </select>
          </div>
          <div class="form-group">
            <label>UF</label>
            <select id="cotacaoUF">
              <option value="">Selecione...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantidade *</label>
            <input type="number" id="cotacaoQuantidade" placeholder="0" min="1" required>
          </div>
          <div class="form-group">
            <label>Valor Unitário (R$) *</label>
            <input type="number" id="cotacaoValorUnitario" placeholder="0,00" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Data da Cotação *</label>
            <input type="date" id="cotacaoData" required>
          </div>
          <div class="form-group">
            <label>Data de Entrega</label>
            <input type="date" id="cotacaoDataEntrega">
          </div>
          
          <!-- Coluna 2 - Impostos e Fiscais -->
          <div class="form-group">
            <label>Alíquota ICMS (%)</label>
            <input type="number" id="cotacaoAliquotaICMS" placeholder="18" step="0.01" value="18">
          </div>
          <div class="form-group">
            <label>Alíquota IPI (%)</label>
            <input type="number" id="cotacaoAliquotaIPI" placeholder="5" step="0.01" value="5">
          </div>
          <div class="form-group">
            <label>Valor do Frete (R$)</label>
            <input type="number" id="cotacaoValorFrete" placeholder="0,00" step="0.01" value="0">
          </div>
          <div class="form-group">
            <label>Prazo de Pagamento</label>
            <input type="text" id="cotacaoPrazoPagamento" placeholder="Ex: 30 dias">
          </div>
          <div class="form-group">
            <label>Condição de Pagamento</label>
            <input type="text" id="cotacaoCondicaoPagamento" placeholder="Ex: Boleto, Cartão">
          </div>
          <div class="form-group full-width">
            <label>Observações</label>
            <textarea id="cotacaoObservacoes" rows="3" placeholder="Observações sobre esta cotação..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalCotacao').style.display='none'">Cancelar</button>
          <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Salvar Cotação</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Atualize o modal de produto -->
<div id="modalProduto" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2><i class="fas fa-box"></i> Produto</h2>
      <button class="close-modal" onclick="document.getElementById('modalProduto').style.display='none'">&times;</button>
    </div>
    <div class="modal-body">
      <form id="formProduto">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome do Produto *</label>
            <input type="text" id="produtoNome" placeholder="Nome do produto" required>
          </div>
          <div class="form-group">
            <label>Código</label>
            <input type="text" id="produtoCodigo" placeholder="Código do produto">
          </div>
          <div class="form-group">
            <label>Categoria</label>
            <input type="text" id="produtoCategoria" placeholder="Ex: Lubrificantes">
          </div>
          <div class="form-group">
            <label>NCM</label>
            <input type="text" id="produtoNCM" placeholder="Ex: 2710.19.90">
          </div>
          <div class="form-group">
            <label>Unidade</label>
            <select id="produtoUnidade">
              <option value="un">Unidade</option>
              <option value="kg">Quilograma</option>
              <option value="l">Litro</option>
              <option value="m">Metro</option>
              <option value="cx">Caixa</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label>Descrição</label>
            <textarea id="produtoDescricao" rows="2" placeholder="Descrição do produto..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalProduto').style.display='none'">Cancelar</button>
          <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Salvar Produto</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Atualize o modal de fornecedor -->
<div id="modalFornecedor" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2><i class="fas fa-truck"></i> Fornecedor</h2>
      <button class="close-modal" onclick="document.getElementById('modalFornecedor').style.display='none'">&times;</button>
    </div>
    <div class="modal-body">
      <form id="formFornecedor">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome *</label>
            <input type="text" id="fornecedorNome" placeholder="Nome do fornecedor" required>
          </div>
          <div class="form-group">
            <label>CNPJ</label>
            <input type="text" id="fornecedorCNPJ" placeholder="00.000.000/0000-00">
          </div>
          <div class="form-group">
            <label>Inscrição Estadual</label>
            <input type="text" id="fornecedorIE" placeholder="123.456.789">
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="fornecedorTelefone" placeholder="(00) 00000-0000">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="fornecedorEmail" placeholder="email@exemplo.com">
          </div>
          <div class="form-group">
            <label>UF</label>
            <select id="fornecedorUF">
              <option value="">Selecione...</option>
              <option value="SP">SP</option><option value="RJ">RJ</option><option value="MG">MG</option>
              <option value="PR">PR</option><option value="SC">SC</option><option value="RS">RS</option>
              <option value="BA">BA</option><option value="PE">PE</option><option value="CE">CE</option>
              <option value="DF">DF</option><option value="GO">GO</option><option value="ES">ES</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label>Observações</label>
            <textarea id="fornecedorObservacoes" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalFornecedor').style.display='none'">Cancelar</button>
          <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Salvar Fornecedor</button>
        </div>
      </form>
    </div>
  </div>
</div>
